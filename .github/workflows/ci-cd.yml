name: Exam Website CI/CD

on:
  push:
    branches: [ master ] # Change from main to master
  pull_request:
    branches: [ master ] # Change from main to master


jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-node-version: '20'

    - name: Install Dependencies
      run: npm install

    - name: Run Exams Application Tests
      run: npm test # Fails the pipeline if your website tests fail

  deploy:
    needs: build-and-test # Only runs if tests pass
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Deploy to Hosting
      run: echo "Add your deployment script here (e.g., AWS, Vercel, Firebase)"